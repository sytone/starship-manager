[workspace]
members = ["crates/core", "crates/preview", "crates/tui", "crates/install"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/sytone/starship-manager"

[workspace.dependencies]
anyhow = "1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
serde_json = "1"
tempfile = "3"

ratatui = "0.29"
crossterm = "0.28"

starship-manager-core = { path = "crates/core" }
starship-manager-preview = { path = "crates/preview" }
starship-manager-tui = { path = "crates/tui" }
starship-manager-install = { path = "crates/install" }

[package]
name = "starship-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "starship-manager"

[dependencies]
starship-manager-tui = { workspace = true }
anyhow = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
