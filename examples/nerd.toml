# Nerd-font-heavy preset with lots of modules.

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$rust\
$nodejs\
$python\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
truncation_length = 5
fish_style_pwd_dir_length = 2

[git_branch]
symbol = " "

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'

[rust]
symbol = "🦀 "

[nodejs]
symbol = " "

[python]
symbol = "🐍 "

[cmd_duration]
min_time = 2_000
